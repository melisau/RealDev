name: Daily reminder dispatcher

on:
  workflow_dispatch:
  schedule:
    # UTC; minute 17 avoids the busiest top-of-hour scheduling period.
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: realdev-reminder-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the reviewed default branch
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Dispatch opted-in reminders and verify the saved server report
        env:
          REMINDER_DISPATCH_TOKEN: ${{ secrets.REALDEV_REMINDER_DISPATCH_TOKEN }}
        run: node scripts/dispatch-reminders.mjs
